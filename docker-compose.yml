# ═══════════════════════════════════════════════════════════
# homelab-reader — Docker Compose
# ═══════════════════════════════════════════════════════════
#
# ── First-time setup on the homelab ───────────────────────────
#
#   Interactive alternative: ./launch.sh asks where the books live and which
#   network to serve, saves the answers to .env, and starts the app — and
#   afterwards doubles as the on-site menu (restart / status / logs / update).
#   The manual steps below remain the canonical reference.
#
#   # 1. Clone the repo onto the host (any directory)
#   git clone https://github.com/d-harbinger/homelab-reader.git
#   cd homelab-reader
#
#   # 2. Answer the network question. REQUIRED — there is no default for
#   #    HOMELAB_HOST_BIND anywhere, and compose refuses to start without it
#   #    (see the network-binding note below). Pick one — 127.0.0.1 for this
#   #    machine only, 0.0.0.0 to serve other devices on the local network:
#   echo 'HOMELAB_HOST_BIND=127.0.0.1' >> .env
#
#   # 3. Point the container at the library folder. Two equivalent ways:
#
#   #    a) Append it to the same .env — recommended, persists across reboots:
#   echo 'BOOKS_HOST_PATH=/srv/books' >> .env
#
#   #    b) Or set it inline for a single `up`:
#   BOOKS_HOST_PATH=/srv/books docker compose up -d --build
#
#   #    (With neither, it falls back to ./books in this repo dir. The bind in
#   #    step 2 has no such fallback — it must be in .env or the environment.)
#
#   # 4. Build and start
#   docker compose up -d --build
#
#   # 5. Open the app
#   #    http://<homelab-ip-or-hostname>:5456
#   #    First scan can take a minute per ~100 books (cover rendering).
#
#   Copying .env.example is a fine starting point, but it ships
#   HOMELAB_HOST_BIND commented out on purpose — a template that carried a
#   value would hand every fresh copy a publish address nobody chose. Copying
#   it alone is therefore not enough to start; uncomment the line or use
#   step 2.
#
# ── Day-to-day operations ─────────────────────────────────────
#
#   docker compose logs -f homelab-reader      # tail logs
#   docker compose restart homelab-reader      # restart only
#   docker compose down                        # stop (keeps data volume)
#   docker compose up -d --build               # apply code changes
#
# ── Updating ──────────────────────────────────────────────────
#
#   git pull
#   docker compose up -d --build
#   # The entrypoint runs `prisma migrate deploy` automatically;
#   # any new migrations apply before the server boots. If migration
#   # fails the container refuses to start and prints a banner.
#
# ── Adding books ──────────────────────────────────────────────
#
#   Drop .epub or .pdf files into the host folder you pointed
#   BOOKS_HOST_PATH at. The scanner picks them up within a few
#   seconds. To force a full rescan from the UI, click "Rescan"
#   (top-right). To delete a book, remove the file from disk —
#   the scanner reconciles on next boot or rescan.
#
# ── Network binding ───────────────────────────────────────────
#
#   HOMELAB_HOST_BIND is required — compose refuses to start until it is set,
#   so who can reach the app is always a deliberate answer, never a fallback
#   (./launch.sh asks once and saves it to .env). Use 127.0.0.1 for the
#   machine itself only; 0.0.0.0 to serve other devices on the local network
#   (the usual homelab case — e.g. feeding android-reader over OPDS). Override
#   the host port with HOMELAB_PORT (default 5456). The container always
#   listens on 3000 inside.
#
# ── Where your data lives ─────────────────────────────────────
#
#   /app/books     bind mount, READ-ONLY  ← your library (host path)
#   /app/data      named volume           ← SQLite DB + covers + AUTH_SECRET
#
#   The scanner never writes into /app/books. Covers and reading
#   progress live in the named volume `homelab-reader-data`.
#   Wipe DB to start fresh: `docker compose down && docker volume rm
#   homelab-reader_homelab-reader-data` (books on disk are untouched).
#
# ═══════════════════════════════════════════════════════════

# Pin the compose project name so the named volume below resolves to a
# stable identifier regardless of the host's directory name (matches the
# pattern chimera adopted after the volume-rename incident).
name: homelab-reader

services:
  homelab-reader:
    build: .
    container_name: homelab-reader
    init: true
    ports:
      # Bind is required (see the network-binding note above); port is
      # overridable via .env (the container always listens on 3000 internally).
      # Default host port is 5456, following the sibling service scheme:
      # chimera 5454, chef-calc-pro 5455, homelab-reader 5456.
      - "${HOMELAB_HOST_BIND:?no saved network answer — run ./launch.sh once, or set HOMELAB_HOST_BIND in .env}:${HOMELAB_PORT:-5456}:3000"
    volumes:
      # The SQLite DB + covers + auth-secret. Persistent named volume.
      - homelab-reader-data:/app/data
      # Your library. EDIT THIS to point at your books folder. Read-only.
      - ${BOOKS_HOST_PATH:-./books}:/app/books:ro
    environment:
      - DATABASE_URL=file:/app/data/homelab-reader.db
      - BOOKS_PATH=/app/books
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_TRUST_HOST=true
      # OPTIONAL, and unset is the normal case. The address a person actually
      # types to reach the reader — for example https://reader.example behind a
      # TLS proxy. A plain-HTTP deployment leaves this empty.
      #
      # Setting it opts into two things at once. It marks the session cookie
      # Secure when the value begins https:// — and only an https:// answer
      # should, because a Secure cookie over plain HTTP is discarded by the
      # browser and nobody can sign in. It also OVERRIDES the origin of every
      # request Auth.js handles (next-auth/lib/env.js, reqWithEnvURL), pinning
      # the deployment to that one address.
      #
      # That second effect is why a box reachable at TWO addresses — a LAN one
      # and a public one — must leave this UNSET. AUTH_TRUST_HOST above then
      # derives the origin per request and both addresses keep working. An
      # empty value is treated as unset by Auth.js (the `if (!url)` guard), so
      # the empty default below is the same as not passing it at all.
      #
      # Deliberately NOT a required variable: every deployment predating it
      # runs without it, and a required variable with no default breaks those
      # boxes on the next pull rather than at the moment someone chose TLS.
      - AUTH_URL=${AUTH_URL:-}
      - NODE_ENV=production
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/scan/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  homelab-reader-data:
