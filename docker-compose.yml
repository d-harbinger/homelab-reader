# ═══════════════════════════════════════════════════════════
# homelab-reader — Docker Compose
# ═══════════════════════════════════════════════════════════
#
# ── First-time setup on the homelab ───────────────────────────
#
#   Interactive alternative: ./launch.sh asks where the books live and which
#   network to serve, saves the answers to .env, and starts the app — and
#   afterwards doubles as the on-site menu (restart / status / logs / update).
#   The manual steps below remain the canonical reference.
#
#   # 1. Clone the repo onto the host (any directory)
#   git clone https://github.com/d-harbinger/homelab-reader.git
#   cd homelab-reader
#
#   # 2. Tell the container where your books live. Two equivalent ways:
#
#   #    a) Create a .env next to this docker-compose.yml — recommended,
#   #       persists across reboots:
#   echo 'BOOKS_HOST_PATH=/srv/books' > .env
#
#   #    b) Or set it inline for a single `up`:
#   BOOKS_HOST_PATH=/srv/books docker compose up -d --build
#
#   #    (If you skip both, it falls back to ./books in this repo dir.)
#
#   # 3. Build and start
#   docker compose up -d --build
#
#   # 4. Open the app
#   #    http://<homelab-ip-or-hostname>:5456
#   #    First scan can take a minute per ~100 books (cover rendering).
#
# ── Day-to-day operations ─────────────────────────────────────
#
#   docker compose logs -f homelab-reader      # tail logs
#   docker compose restart homelab-reader      # restart only
#   docker compose down                        # stop (keeps data volume)
#   docker compose up -d --build               # apply code changes
#
# ── Updating ──────────────────────────────────────────────────
#
#   git pull
#   docker compose up -d --build
#   # The entrypoint runs `prisma migrate deploy` automatically;
#   # any new migrations apply before the server boots. If migration
#   # fails the container refuses to start and prints a banner.
#
# ── Adding books ──────────────────────────────────────────────
#
#   Drop .epub or .pdf files into the host folder you pointed
#   BOOKS_HOST_PATH at. The scanner picks them up within a few
#   seconds. To force a full rescan from the UI, click "Rescan"
#   (top-right). To delete a book, remove the file from disk —
#   the scanner reconciles on next boot or rescan.
#
# ── Network binding ───────────────────────────────────────────
#
#   Defaults to 0.0.0.0:5456 — LAN-accessible. Override the host port and
#   interface via .env: HOMELAB_PORT (default 5456) and HOMELAB_HOST_BIND
#   (default 0.0.0.0). For localhost-only (e.g. behind a reverse proxy), set
#   HOMELAB_HOST_BIND=127.0.0.1. The container always listens on 3000 inside.
#
# ── Where your data lives ─────────────────────────────────────
#
#   /app/books     bind mount, READ-ONLY  ← your library (host path)
#   /app/data      named volume           ← SQLite DB + covers + AUTH_SECRET
#
#   The scanner never writes into /app/books. Covers and reading
#   progress live in the named volume `homelab-reader-data`.
#   Wipe DB to start fresh: `docker compose down && docker volume rm
#   homelab-reader_homelab-reader-data` (books on disk are untouched).
#
# ═══════════════════════════════════════════════════════════

# Pin the compose project name so the named volume below resolves to a
# stable identifier regardless of the host's directory name (matches the
# pattern chimera adopted after the volume-rename incident).
name: homelab-reader

services:
  homelab-reader:
    build: .
    container_name: homelab-reader
    init: true
    ports:
      # Host bind + port are overridable via .env (the container always listens
      # on 3000 internally). Default host port is 5456, following the sibling
      # service scheme: chimera 5454, chef-calc-pro 5455, homelab-reader 5456.
      - "${HOMELAB_HOST_BIND:-0.0.0.0}:${HOMELAB_PORT:-5456}:3000"
    volumes:
      # The SQLite DB + covers + auth-secret. Persistent named volume.
      - homelab-reader-data:/app/data
      # Your library. EDIT THIS to point at your books folder. Read-only.
      - ${BOOKS_HOST_PATH:-./books}:/app/books:ro
    environment:
      - DATABASE_URL=file:/app/data/homelab-reader.db
      - BOOKS_PATH=/app/books
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_TRUST_HOST=true
      - NODE_ENV=production
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/scan/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  homelab-reader-data:
